# http 级共享定义，放置于 /etc/nginx/conf.d/jobgraph-http.conf
#
# limit_req_zone、limit_conn_zone 与 map 均只能定义在 http 上下文，故与站点配置
# 分置两处。Debian 系的 /etc/nginx/nginx.conf 已 include conf.d/*.conf，无须改动。

# ---- 限额 ----
# 两类限额分别针对两种滥用：
#   速率限额  防止简历抽取接口被反复调用，该接口每次调用均消耗模型额度；
#   并发限额  防止单一来源长时间占满后端，抽取为常驻子进程，单次可达数分钟。
#
# 取值以现场演示的可用性为先。两项均按来源地址计，而校园网与会场网络的公网
# 出口多为 NAT，全部观众共用一个地址，限额定得过严会使多数人直接被拒。
# 一次完整的匹配流程含预检与抽取两次请求，故 20r/m 约合每分钟十人次。
# 若确知访问者来自同一出口且人数更多，演示前应进一步调高，或临时注释限额；
# 反之，额度敏感时应加访问令牌，仅靠按地址限流并不足以防刷。

limit_req_zone  $binary_remote_addr zone=jobgraph_extract:10m rate=20r/m;
limit_req_zone  $binary_remote_addr zone=jobgraph_api:10m     rate=300r/m;
limit_conn_zone $binary_remote_addr zone=jobgraph_conn:10m;

# 超出限额时返回 429，便于与后端自身的 4xx 区分。
limit_req_status  429;
limit_conn_status 429;

# ---- 缓存策略 ----
# Nginx 的 add_header 不叠加：任一 location 内出现 add_header，该层级即不再继承
# 上层的全部 add_header。若按路径分别在 location 中声明 Cache-Control，
# server 级的 HSTS 等响应头会在这些路径上一并消失。故改为按 $uri 映射取值，
# 全部 add_header 统一留在 server 级。
#
#   /assets/  构建产物文件名含内容散列，变更即换名，可长期缓存；
#   /data/    图谱数据文件名不含散列，更新后依赖重新校验生效，只作短期缓存；
#   其余      入口文档与接口响应一律不缓存。

map $uri $jobgraph_cache_control {
    default     "no-cache";
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/data/    "public, max-age=300, must-revalidate";
}
