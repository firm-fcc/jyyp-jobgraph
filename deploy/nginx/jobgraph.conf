# JobGraph 站点配置，放置于 /etc/nginx/sites-available/jobgraph.conf
#
# 前端静态产物与人岗匹配服务同域发布：静态文件由本机 root 直接交付，
# /api/ 与 /health 反向代理至同机 uvicorn。同源可省去 CORS 与混合内容两类问题，
# 亦使前端只需一个 VITE_MATCH_API 取值（站点自身的 https 地址）。
#
# 依赖两个同目录文件，须先各就其位：
#   jobgraph-http.conf   -> /etc/nginx/conf.d/       （限额与缓存映射）
#   jobgraph-proxy.conf  -> /etc/nginx/snippets/     （反向代理公共片段）
#
# 使用前把 example.com 替换为实际域名。

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # 校验目录独立于站点根：前端发布采用整目录替换，若与站点根同址，
    # 每次发布都会抹掉挑战文件而使续期失败。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 的 Nginx 为 1.24，独立的 http2 指令要到 1.25.1 才引入，
    # 故沿用 listen 上的写法。1.25.1 及以上会提示该写法已废弃，但仍然生效。
    #
    # so_keepalive 是本方案中最要紧的一项。简历抽取期间连接可静默数分钟，
    # 而移动网络与办公网络的 NAT 通常在五分钟左右回收空闲映射，跨境链路途经的
    # 中间设备更多，回收概率高于境内。开启后内核在空闲 60 秒时即发出探测包，
    # 每 30 秒一次，连续 10 次失败才判定断开，使映射在整个等待期间保持活跃。
    # 三段取值依次为 keepidle:keepintvl:keepcnt。
    listen 443 ssl http2 so_keepalive=60s:30s:10;
    listen [::]:443 ssl http2 so_keepalive=60s:30s:10;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 全部 add_header 集中于此。Nginx 的 add_header 不叠加：任一 location 内出现
    # add_header，该层级即不再继承上层的全部 add_header，分散声明会使 HSTS 等
    # 响应头在那些路径上失效。Cache-Control 按 $uri 取值，映射见 jobgraph-http.conf。
    add_header Cache-Control             $jobgraph_cache_control always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # HSTS 会使浏览器在有效期内拒绝明文回落。证书与解析稳定运行数日之后
    # 可把 max-age 调至 31536000，在此之前保持 300 秒以便回退。
    add_header Strict-Transport-Security "max-age=300" always;

    root /var/www/jobgraph;
    index index.html;

    # 图谱数据为 12 个 JSON，未压缩合计 15.1 MB，gzip 后 2.97 MB，
    # 压缩比在五倍以上，故 application/json 的压缩属必须项。
    # 预压缩产物的直接交付由 gzip_static 承担，该指令来自可选模块，
    # 是否编入随发行版而异，故不在此处声明：初始化脚本检出该模块后，
    # 会在 conf.d 中以 http 级配置启用，本 server 继承即可。
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml application/javascript
                    application/json application/xml image/svg+xml;

    # 上传上限与后端 MAX_RESUME_BYTES（10 MB）对齐并留出 multipart 编码余量。
    client_max_body_size 12m;
    client_body_timeout  300s;

    # 续期沿用 HTTP-01 校验，443 一侧同样应答，以免跳转后取不到挑战文件。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # 原型页不属于发布内容，随产物存在但不对外提供。
    location = /_proto.html {
        return 404;
    }

    # 构建产物数量多且缓存期长，其访问日志无留存价值。
    location ^~ /assets/ {
        access_log off;
    }

    # 简历抽取：单次调用消耗模型额度且耗时以分钟计，同时施加速率与并发两道限额。
    # 该路径同时承担预检（?preflight=true），两者共用同一份配额。
    # 取值依据与 NAT 共用出口的注意事项见 jobgraph-http.conf。
    location = /api/candidate {
        limit_req  zone=jobgraph_extract burst=10;
        limit_conn jobgraph_conn 6;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/jobgraph-proxy.conf;
    }

    location /api/ {
        limit_req zone=jobgraph_api burst=50 nodelay;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/jobgraph-proxy.conf;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/jobgraph-proxy.conf;
        access_log off;
    }

    # 前端走 HashRouter，全部路由挂在 # 之后，服务端只需交付单一入口。
    # 此处的兜底仅用于直接键入路径的情形。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
