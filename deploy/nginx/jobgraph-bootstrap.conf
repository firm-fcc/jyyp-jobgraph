# 首次签发证书专用的过渡配置，放置于 /etc/nginx/sites-available/jobgraph.conf
#
# Let's Encrypt 的 HTTP-01 校验须在 80 端口应答，而证书尚未签发时 443 无法启动，
# 故先以本文件占位，签发成功后改用同目录的 jobgraph.conf 覆盖。
#
# 使用前把 example.com 替换为实际域名（含 www 子域时一并列出）。

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # 校验目录独立于站点根：前端发布采用整目录替换，若与站点根同址，
    # 每次发布都会抹掉挑战文件而使续期失败。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # 证书签发之前，站点先以明文提供，便于确认解析与 Nginx 均已就绪。
    root /var/www/jobgraph;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
